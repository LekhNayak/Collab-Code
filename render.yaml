# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Backend only. The frontend (packages/client) is deployed on Vercel.
#
# The database is Neon Postgres (external), so no Render database is created.
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render creates:
#   colab-api  Express + WebSocket server (Docker, ./Dockerfile)
#
# On first sync Render prompts for:
#   DATABASE_URL  your Neon connection string (postgresql://...?sslmode=require)
#   FRONTEND_URL  your Vercel URL(s), e.g. https://your-app.vercel.app
#   PISTON_URL    leave empty to run code on Wandbox
# JWT_SECRET is generated by Render. Then set VITE_API_URL in the Vercel project to this
# service's URL (e.g. https://colab-api.onrender.com) and redeploy the frontend.

services:
  # ── Backend: REST API + Yjs WebSocket server ──────────────────────────────────
  - type: web
    name: colab-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - packages/server/**
        - packages/shared/**
        - Dockerfile
        - start.sh
        - package-lock.json
    envVars:
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL          # client origin(s) allowed by CORS, comma-separated
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      # Optional: point at a self-hosted Piston (e.g. https://piston.example.com/api/v2).
      # When unset, code runs on the free Wandbox API.
      - key: PISTON_URL
        sync: false
    # Workspace files live under DATA_DIR. On the free plan that directory is wiped whenever
    # the service restarts, redeploys or spins down after 15 idle minutes; files, sessions and
    # custom extensions are restored from Postgres, but git history (.git) is not. To keep git
    # history too, switch to a paid plan (starter or higher) and uncomment:
    # disk:
    #   name: colab-data
    #   mountPath: /data
    #   sizeGB: 1

