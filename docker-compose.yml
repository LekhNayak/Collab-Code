services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    restart: always

    ports:
      - "2000:2000"

    tmpfs:
      - /piston/jobs:exec,size=256m

    volumes:
      - piston_packages:/piston/packages

    security_opt:
      - label=disable

volumes:
  piston_packages: